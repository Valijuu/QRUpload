<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>QRUpload</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://kit.fontawesome.com/73fbb3b285.js" crossorigin="anonymous"></script>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="prefetch" as="image" href="/Tagesablauf.png">
  <link rel="prefetch" as="image" href="/Sabina_Papiorek.jpg">
  <link rel="prefetch" as="image" href="/Sammy_Loveless.jpg">
  <link rel="prefetch" as="image" href="/frezhDj.jpg">
  <link rel="prefetch" as="image" href="/Blumen_Rauh.jpg">
  <link rel="prefetch" as="image" href="/Dance_Cube.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    #app-loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #8ea999 0%, #a8bcaf 28%, #edf4ef 58%, #f7faf7 100%);
      z-index: 9999;
    }
    #app-loading .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255, 255, 255, 0.6);
      border-top-color: #41594b;
      border-radius: 50%;
      animation: app-loading-spin 0.8s linear infinite;
    }
    @keyframes app-loading-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div id="app-loading"><div class="spinner"></div></div>
<app-root></app-root>
</body>
</html>
