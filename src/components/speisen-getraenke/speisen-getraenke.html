<section>
  <h1 class="speisen-getraenke-title">{{ speisenGetraenkeTitle }}</h1>
  <p class="speisen-getraenke-opener">{{ speisenGetraenkeOpener }}</p>
</section>
<section class="speisen-getraenke-cards">
  <div class="speisen-getraenke-card">
    <h2 class="speisen-getraenke-card-title">Getränke</h2>
    <img
      src="./Getraenkekarte.png"
      alt="Getränkekarte: Aperitif, Weine, Biere, Spirituosen, alkoholfreie Getränke"
      class="speisen-getraenke-card-image"
      fetchpriority="high"
    />
  </div>
  <div class="speisen-getraenke-card">
    <h2 class="speisen-getraenke-card-title">Speisen</h2>
    <img
      src="./Speisekarte.png"
      alt="Menükarte: Starter, Hauptgang Buffet, Hochzeitstorte, Mitternachtssnack"
      class="speisen-getraenke-card-image"
    />
  </div>
</section>
