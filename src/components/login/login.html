<section class="login">
  <p class="eyebrow">UNSERE FOTOS</p>
  <h1 class="title">Schön, dass ihr vorbeischaut</h1>
  <p class="subtitle">Bitte gebt das Passwort ein, das wir euch geschickt haben.</p>

  <form class="login-form" method="post" (submit)="submit($event)">
    <label class="field-label" for="gallery-password">Passwort</label>
    <div class="password-field">
    <input
      id="gallery-password"
      class="password-input"
      [type]="revealed() ? 'text' : 'password'"
      name="password"
      autocomplete="current-password"
      [value]="password()"
      [attr.aria-invalid]="message() ? 'true' : null"
      [attr.aria-describedby]="message() ? 'login-message' : null"
      (input)="updatePassword($event)"
    />
    <button
      type="button"
      class="reveal"
      [attr.aria-pressed]="revealed()"
      [attr.aria-label]="revealed() ? 'Passwort verbergen' : 'Passwort anzeigen'"
      (click)="toggleReveal()"
    >
      <span class="monkey" aria-hidden="true">{{ revealed() ? '🐵' : '🙈' }}</span>
    </button>
    </div>
    @if (message(); as text) {
      <p id="login-message" class="message" role="alert">{{ text }}</p>
    }
    <button type="submit" class="primary-btn lifted" [disabled]="!password()">Zu den Fotos</button>
  </form>
</section>
