<div class="backdrop" role="dialog" aria-modal="true" aria-label="Foto in groß" [class.immersive]="immersive()">
  <div class="toolbar">
    <span class="counter" aria-live="polite">{{ current() + 1 }} / {{ photos().length }}</span>
    <a class="download" [href]="originalUrl()(photo().id)" download>Original herunterladen</a>
    <button type="button" class="fullscreen" (click)="toggleImmersive()" [attr.aria-pressed]="immersive()" aria-label="Vollbild">⛶</button>
    <button type="button" class="close" (click)="close()" aria-label="Schließen">✕</button>
  </div>

  <div class="stage" [attr.tabindex]="immersive() ? 0 : -1"
       [attr.aria-label]="immersive() ? 'Foto im Vollbild, antippen für die Bedienung' : null"
       (pointerdown)="onPointerDown($event)" (pointermove)="onPointerMove($event)"
       (pointerup)="onPointerUp($event)" (pointercancel)="onPointerCancel($event)">
    <img [src]="mobileUrl()(photo().id)" [alt]="'Foto ' + (current() + 1)" draggable="false" [style.transform]="transform()" />
  </div>

  <button type="button" class="nav previous" (click)="previous()" [disabled]="!hasPrevious()" aria-label="Vorheriges Foto">‹</button>
  <button type="button" class="nav next" (click)="next()" [disabled]="!hasNext()" aria-label="Nächstes Foto">›</button>
</div>
