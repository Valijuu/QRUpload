<div class="backdrop" role="dialog" aria-modal="true" aria-label="Foto in groß">
  <div class="toolbar">
    <span class="counter">{{ current() + 1 }} / {{ photos().length }}</span>
    <a class="download" [href]="originalUrl()(photo().id)" download>Original herunterladen</a>
    <button type="button" class="close" (click)="close()" aria-label="Schließen">✕</button>
  </div>

  <div class="stage" (pointerdown)="onPointerDown($event)" (pointerup)="onPointerUp($event)">
    <img [src]="mobileUrl()(photo().id)" [alt]="'Foto ' + (current() + 1)" draggable="false" />
  </div>

  <button type="button" class="nav previous" (click)="previous()" [disabled]="!hasPrevious()" aria-label="Vorheriges Foto">‹</button>
  <button type="button" class="nav next" (click)="next()" [disabled]="!hasNext()" aria-label="Nächstes Foto">›</button>
</div>
